<!DOCTYPE html>
<html>
<head>
  <title>AI Career OS</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* HEADER LOGO */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      padding: 0 20px;
      z-index: 9999;
      backdrop-filter: blur(10px);
    }

    .topbar img {
      height: 40px;
      width: auto;
      object-fit: contain;
    }

    .topbar h1 {
      color: white;
      font-size: 18px;
      margin-left: 12px;
      font-weight: 600;
    }

    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      padding-top: 60px;
      box-sizing: border-box;
    }
  </style>
</head>

<body>

  <!-- LOGO -->
  <div class="topbar">
    <img src="AICAREER-RADEN.png" alt="Logo">
    <h1>AI Career OS</h1>
  </div>

  <!-- APP -->
  <iframe src="https://script.google.com/macros/s/AKfycbyGTCJS1TNJE0J2rhfr77tk4ehSAJDRRPDNUz99YL13Y_gZYj2EqGj2QEdEWoSV6Us/exec"></iframe>

</body>
</html>
